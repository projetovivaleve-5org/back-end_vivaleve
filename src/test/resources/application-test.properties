# Usado pelos testes de contexto (@TestPropertySource). Sobrescreve o Postgres do application.yml por H2 em memória.
spring.datasource.url=jdbc:h2:mem:pluma;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=DATE,USER,VALUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
pluma.ai.api-key=

# Valores FALSOS, só para o contexto subir nos testes (SecurityConfig e GoogleTokenVerifier exigem os dois).
# Os valores reais vêm das variáveis JWT_SECRET e GOOGLE_CLIENT_ID (Render / .env local).
jwt.secret=segredo-de-teste-com-pelo-menos-32-bytes!!
google.client-id=client-id-de-teste.apps.googleusercontent.com
